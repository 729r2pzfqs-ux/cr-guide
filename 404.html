        function normalizeUmlauts(s) {
            return s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
                    .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue');
        }

        function stripUmlautEncoding(s) {
            return s.replace(/s-ure/g, 'saeure').replace(/-l$/,'ol').replace(/-le$/,'ole')
                    .replace(/-ure/g,'ure');
        }

        function attemptRedirect() {
            var pathname = window.location.pathname.toLowerCase().replace(/\/+$/,'');
            var parts = pathname.split('/').filter(function(p){return p;});
            if (parts.length === 0) return;

            var redirectUrl = null;
            var reason = '';

            // Pattern 1: /chemicals/... paths (handles swapped material/chemical and .html extensions)
            if (parts[0] === 'chemicals' && parts.length >= 2) {
                var part1 = parts[1].replace(/\.html$/, '');
                var part2 = parts.length >= 3 ? parts[2].replace(/\.html$/, '') : null;
                var hadHtml = parts[1].match(/\.html$/) || (parts.length >= 3 && parts[2].match(/\.html$/));

                // Pattern 1a: /chemicals/{material}/{chemical}(.html) → swap to /chemicals/{chemical}/{material}/
                if (part2 && knownMaterials.indexOf(part1) !== -1) {
                    var chemSlug = part2;
                    var matSlug = part1;
                    var normChem = normalizeUmlauts(decodeURIComponent(chemSlug));
                    var strippedChem = stripUmlautEncoding(normChem);
                    var engChem = germanToEnglish[chemSlug] || germanToEnglish[normChem] || germanToEnglish[strippedChem] || chemSlug;
                    redirectUrl = '/chemicals/' + engChem + '/' + matSlug + '/';
                    reason = 'Redirecting to correct chemical/material URL order';
                }
                // Pattern 1b: /chemicals/{chemical}/{material}(.html) → strip .html, add trailing slash
                else if (part2 && knownMaterials.indexOf(part2) !== -1 && hadHtml) {
                    var slug1b = part1;
                    var norm1b = normalizeUmlauts(decodeURIComponent(slug1b));
                    var strip1b = stripUmlautEncoding(norm1b);
                    var eng1b = germanToEnglish[slug1b] || germanToEnglish[norm1b] || germanToEnglish[strip1b] || slug1b;
                    redirectUrl = '/chemicals/' + eng1b + '/' + part2 + '/';
                    reason = 'Redirecting from .html to directory format';
                }
                // Pattern 1c: /chemicals/{german-slug} or /chemicals/{german-slug}/{material} (original)
                else {
                    var slug = part1;
                    var material = part2;
                    var normalized = normalizeUmlauts(decodeURIComponent(slug));
                    var stripped = stripUmlautEncoding(normalized);
                    var englishSlug = germanToEnglish[slug] || germanToEnglish[normalized] || germanToEnglish[stripped] || null;
                    if (englishSlug) {
                        redirectUrl = material && knownMaterials.indexOf(material) !== -1
                            ? '/chemicals/' + englishSlug + '/' + material + '/'
                            : '/chemicals/' + englishSlug + '/';
                        reason = 'Redirecting translated chemical name to English';
                    } else if (slug !== normalized) {
                        redirectUrl = material
                            ? '/chemicals/' + normalized + '/' + material + '/'
                            : '/chemicals/' + normalized + '/';
                        reason = 'Normalizing special characters in URL';
                    } else if (hadHtml) {
                        redirectUrl = material
                            ? '/chemicals/' + slug + '/' + material + '/'
                            : '/chemicals/' + slug + '/';
                        reason = 'Redirecting from .html to directory format';
                    }
                }
            }

            // Pattern 2: /{material}/{chemical} - material page with German chemical
            if (!redirectUrl && knownMaterials.indexOf(parts[0]) !== -1 && parts.length >= 2) {
                var chemSlug = parts[1];
                var normChem = normalizeUmlauts(decodeURIComponent(chemSlug));
                var strippedChem = stripUmlautEncoding(normChem);
                var engChem = germanToEnglish[chemSlug] || germanToEnglish[normChem] || germanToEnglish[strippedChem] || null;
                if (engChem) {
                    redirectUrl = '/' + parts[0] + '/' + engChem + '/';
                    reason = 'Redirecting to English chemical name';
                } else if (chemSlug !== normChem) {
                    redirectUrl = '/' + parts[0] + '/' + normChem + '/';
                    reason = 'Normalizing special characters';
                }
            }

            // Pattern 3: /materials/{material}.html → /materials/{material}/
            if (!redirectUrl && parts[0] === 'materials' && parts.length === 2 && parts[1].match(/\.html$/)) {
                var matName = parts[1].replace('.html','');
                redirectUrl = '/materials/' + matName + '/';
                reason = 'Redirecting from old .html format';
            }

            // Pattern 4: /viscosity.html → /viscosity/
            if (!redirectUrl && pathname === '/viscosity.html') {
                redirectUrl = '/viscosity/';
                reason = 'Redirecting from old page format';
            }

            // Pattern 5: /storage-compatibility.html → /storage-compatibility/
            if (!redirectUrl && pathname === '/storage-compatibility.html') {
                redirectUrl = '/storage-compatibility/';
                reason = 'Redirecting from old page format';
            }

            // Pattern 6: /sds-decoder.html → /sds-decoder/
            if (!redirectUrl && pathname === '/sds-decoder.html') {
                redirectUrl = '/sds-decoder/';
                reason = 'Redirecting from old page format';
            }

            // Pattern 7: Language paths - /de/chemicals/... redirect to /chemicals/...
            if (!redirectUrl && (parts[0] === 'de' || parts[0] === 'es' || parts[0] === 'fr' || parts[0] === 'pt') && parts.length >= 3 && parts[1] === 'chemicals') {
                var langChemSlug = parts[2];
                var engFromLang = germanToEnglish[langChemSlug] || langChemSlug;
                redirectUrl = '/chemicals/' + engFromLang + '/';
                reason = 'Redirecting from translated path to English';
            }

            // Pattern 7b: /{lang}/{page}.html → /{lang}/ or /{page}/
            if (!redirectUrl && (parts[0] === 'de' || parts[0] === 'es' || parts[0] === 'fr' || parts[0] === 'pt') && parts.length === 2 && parts[1].match(/\.html$/)) {
                var pageName = parts[1].replace('.html','');
                redirectUrl = '/' + pageName + '/';
                reason = 'Redirecting from language .html path';
            }

            // Pattern 8: Try adding trailing slash
            if (!redirectUrl && !pathname.match(/\.\w+$/) && !pathname.match(/\/$/)) {
                redirectUrl = pathname + '/';
                reason = 'Adding trailing slash';
            }

            if (redirectUrl && redirectUrl !== pathname && redirectUrl !== pathname + '/') {
                showRedirect(reason, redirectUrl);
                setTimeout(function(){ window.location.href = redirectUrl; }, 2000);

            el.innerHTML = '<strong>Redirect:</strong> ' + reason + '<br>Taking you to <a href="' + url + '" style="color:#047857;text-decoration:underline;">' + url + '</a>...';
            el.style.display = 'block';
